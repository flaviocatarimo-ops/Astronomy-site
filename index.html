<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Galeria de Astrofotografia</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            color: #8a99ad;
            margin-bottom: 5px;
            font-size: 16px;
        }
        .author {
            color: #58a6ff;
            margin-bottom: 25px;
            font-size: 15px;
            font-weight: bold;
        }
        
        /* Destaque Principal Compacto e Elegante */
        .featured-container {
            max-width: 600px;
            margin: 0 auto 30px auto;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .featured-image {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }
        .featured-caption {
            padding: 12px;
            font-size: 14px;
            color: #58a6ff;
            font-weight: bold;
            background-color: #161b22;
            border-top: 1px solid #30363d;
        }

        /* Botões de Filtro */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: #161b22;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: #30363d;
            border-color: #58a6ff;
            color: #ffffff;
        }

        /* Secções e Grelhas */
        .section-title {
            text-align: left;
            max-width: 1200px;
            margin: 30px auto 15px auto;
            font-size: 18px;
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
            padding-bottom: 6px;
            padding-left: 5px;
        }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .card img, .card video {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .card-title {
            padding: 15px;
            font-size: 14px;
            color: #c9d1d9;
            word-break: break-all;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            color: #8a99ad;
            font-size: 13px;
            border-top: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .counters-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .contador {
            font-size: 12px;
            color: #58a6ff;
        }
    </style>
</head>
<body>

    <h1>Minha Galeria de Astrofotografia</h1>
    <div class="subtitle">Trabalhos de captura e processamento com telescópio.</div>
    <div class="author">Flávio da Silva</div>

    <!-- Destaque Principal Limpo no Topo -->
    <div class="featured-container">
        <img src="images/2026-10-29T21.46.26.png" alt="Destaque Principal" class="featured-image">
        <div class="featured-caption">✨ Imagem em Destaque: Nebulosa de Órion</div>
    </div>

    <!-- Botões de navegação por categorias -->
    <div class="filter-container">
        <button class="filter-btn active" onclick="filtrarGaleria('todos', this)">Início</button>
        <button class="filter-btn" onclick="filtrarGaleria('ceu-profundo', this)">Céu Profundo</button>
        <button class="filter-btn" onclick="filtrarGaleria('sistema-solar', this)">Sistema Solar / Lua</button>
        <button class="filter-btn" onclick="filtrarGaleria('sol', this)">Sol</button>
    </div>

    <!-- Conteúdo Dinâmico -->
    <div id="conteudo-principal"></div>

    <footer>
        <div>&copy; 2026 Flávio da Silva. Todos os direitos reservados.</div>
        
        <div class="counters-container">
            <div>
                <a href="https://info.flagcounter.com/ftVs"><img src="https://s05.flagcounter.com/count2/ftVs/bg_0B0F19/txt_FFFFFF/border_30363D/columns_2/maxflags_10/viewers_3/labels_1/pageviews_1/flags_0/percent_0/" alt="Flag Counter" border="0"></a>
            </div>
            <div class="contador">
                Visualizações da página: <span id="contador-visitas">A carregar...</span>
            </div>
        </div>
    </footer>

<script>
    const itensGaleria = [
        // Céu Profundo
        { tipo: "imagem", caminho: "images/2026-10-29T21.46.26.png", legenda: "Nebulosa de Órion", categoria: "ceu-profundo" },
        { tipo: "imagem", caminho: "images/2026-10-29T21.46.38.png", legenda: "Detalhe de Céu Profundo", categoria: "ceu-profundo" },
        { tipo: "imagem", caminho: "images/IMG_20260616_232609.jpg", legenda: "Rastos de Estrelas (Star Trails)", categoria: "ceu-profundo" },
        { tipo: "imagem", caminho: "images/IMG_20260419_023636.jpg", legenda: "Rotação Estelar", categoria: "ceu-profundo" },
        
        // Sistema Solar / Lua
        { tipo: "imagem", caminho: "images/20250731_225930.jpg", legenda: "Captura Noturna", categoria: "sistema-solar" },
        { tipo: "imagem", caminho: "images/Screenshot_20231019_163639_Facebook.jpg", legenda: "Jupiter", categoria: "sistema-solar" },
        { tipo: "imagem", caminho: "images/Screenshot 2026-03-24 235314.png", legenda: "Processamento e Calibração", categoria: "sistema-solar" },
        { tipo: "imagem", caminho: "images/Lua2.jpg", legenda: "Lua2", categoria: "sistema-solar" },
        { tipo: "imagem", caminho: "images/FB_IMG_1697729740640.jpg", legenda: "Transito de Venus", categoria: "sistema-solar" },
        
        // Sol
        { tipo: "imagem", caminho: "images/Sol5.png", legenda: "Sol - Processamento", categoria: "sol" },
        { tipo: "imagem", caminho: "images/Sol6.png", legenda: "Disco Solar Detalhado", categoria: "sol" },
        { tipo: "imagem", caminho: "images/sol.1.jpg", legenda: "Observação Solar 1", categoria: "sol" },
        { tipo: "imagem", caminho: "images/sol.3.jpg", legenda: "Observação Solar 2", categoria: "sol" },
        { tipo: "imagem", caminho: "images/sol.3.png", legenda: "Análise do Sol", categoria: "sol" }
    ];

    const containerPrincipal = document.getElementById("conteudo-principal");

    function criarSecao(titulo, itens) {
        if (itens.length === 0) return "";
        
        let htmlCards = '';
        itens.forEach(item => {
            htmlCards += `
                <div class="card">
                    <img src="${item.caminho}" alt="Astrofotografia">
                    <div class="card-title">${item.legenda}</div>
                </div>
            `;
        });

        return `
            <div class="section-title">${titulo}</div>
            <div class="gallery-container">
                ${htmlCards}
            </div>
        `;
    }

    function renderizarGaleria(filtro) {
        containerPrincipal.innerHTML = "";

        const ceuProfundo = itensGaleria.filter(i => i.categoria === 'ceu-profundo');
        const sistemaSolar = itensGaleria.filter(i => i.categoria === 'sistema-solar');
        const sol = itensGaleria.filter(i => i.categoria === 'sol');

        if (filtro === 'todos') {
            // No estado inicial ("Início"), não mostramos nenhuma grelha de imagens para a página ficar limpa
            containerPrincipal.innerHTML = '<div style="color: #8a99ad; margin-top: 20px; font-size: 14px;">Selecione uma categoria acima para explorar os trabalhos.</div>';
        } else if (filtro === 'ceu-profundo') {
            containerPrincipal.innerHTML += criarSecao("🌌 Céu Profundo", ceuProfundo);
        } else if (filtro === 'sistema-solar') {
            containerPrincipal.innerHTML += criarSecao("🪐 Sistema Solar / Lua", sistemaSolar);
        } else if (filtro === 'sol') {
            containerPrincipal.innerHTML += criarSecao("☀️ Sol", sol);
        }
    }

    function filtrarGaleria(categoria, botao) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        botao.classList.add('active');
        renderizarGaleria(categoria);
    }

    // Arranque limpo: a página principal mostra apenas o destaque e o menu
    renderizarGaleria('todos');

    // Contador inteligente global
    const jaVisitou = localStorage.getItem('siteVisitadoPorMim');
    const endpointContador = jaVisitou 
        ? 'https://api.counterapi.dev/v1/flaviocatarimo-ops/astronomy-site' 
        : 'https://api.counterapi.dev/v1/flaviocatarimo-ops/astronomy-site/hit';

    fetch(endpointContador)
        .then(response => response.json())
        .then(data => {
            document.getElementById('contador-visitas').innerText = data.count || data.value || "1";
            if (!jaVisitou) {
                localStorage.setItem('siteVisitadoPorMim', 'true');
            }
        })
        .catch(error => {
            document.getElementById('contador-visitas').innerText = "1";
        });
</script>
</body>
</html>
