<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Galeria de Astrofotografia</title>
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Cabeçalho Destacado */
        header {
            margin-bottom: 35px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 42px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }
        .subtitle {
            color: #58a6ff;
            margin: 0 0 8px 0;
            font-size: 18px;
            font-weight: bold;
        }
        .author {
            color: #8a99ad;
            font-size: 14px;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: #161b22;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: #30363d;
            border-color: #58a6ff;
            color: #ffffff;
        }
        .section-title {
            text-align: left;
            max-width: 1200px;
            margin: 40px auto 20px auto;
            font-size: 20px;
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
            padding-left: 5px;
        }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform 0.2s;
            image-rendering: -webkit-optimize-contrast; 
        }
        .card img:hover {
            transform: scale(1.03);
        }
        .card-title {
            padding: 15px;
            font-size: 14px;
            color: #c9d1d9;
            word-break: break-all;
        }

        /* Estilo do Modal (Lightbox) com otimização de resolução */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .modal-content {
            width: auto;
            max-width: 95vw;
            max-height: 85vh;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.7);
            object-fit: contain;
            image-rendering: auto; 
        }
        .modal-caption {
            margin-top: 15px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #ffffff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-modal:hover {
            color: #58a6ff;
        }

        /* Caixa de Contacto */
        .contact-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto 30px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .contact-box h3 {
            margin-top: 0;
            color: #58a6ff;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .contact-box p {
            color: #c9d1d9;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .email-link {
            display: inline-block;
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .email-link:hover {
            background-color: #30363d;
            color: #ffffff;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            padding-bottom: 20px;
            color: #8a99ad;
            font-size: 13px;
            border-top: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Minha Galeria de Astrofotografia</h1>
        <div class="subtitle">Trabalhos de captura e processamento com telescópio.</div>
        <div class="author">Flávio da Silva</div>
    </header>

    <div class="filter-container">
        <button class="filter-btn active" onclick="filtrarGaleria('todos', this)">Todos</button>
        <button class="filter-btn" onclick="filtrarGaleria('ceu-profundo', this)">Céu Profundo</button>
        <button class="filter-btn" onclick="filtrarGaleria('sistema-solar', this)">Sistema Solar / Lua</button>
        <button class="filter-btn" onclick="filtrarGaleria('sol', this)">Sol</button>
    </div>

    <div id="conteudo-principal"></div>

    <!-- Janela Modal (Lightbox) -->
    <div id="lightboxModal" class="modal" onclick="fecharModal()">
        <span class="close-modal" onclick="fecharModal()">&times;</span>
        <img class="modal-content" id="imgAmpliada">
        <div class="modal-caption" id="legendaAmpliada"></div>
    </div>

    <footer>
        <div class="contact-box">
            <h3>📬 Contacto</h3>
            <p>Tens alguma questão sobre as capturas ou equipamento? Entra em contacto:</p>
            <a href="mailto:o_teu_email@exemplo.com" class="email-link">📧 Enviar Email</a>
        </div>

        <div>&copy; 2026 Flávio da Silva. Todos os direitos reservados.</div>
        <div>
            <a href="https://info.flagcounter.com/ftVs"><img src="https://s05.flagcounter.com/count2/ftVs/bg_0B0F19/txt_FFFFFF/border_30363D/columns_2/maxflags_10/viewers_3/labels_1/pageviews_1/flags_0/percent_0/" alt="Flag Counter" border="0"></a>
        </div>
    </footer>

<script>
    const itensGaleria = [
        // 🌌 Céu Profundo
        { caminho: "images/2026-10-29T21.46.26.png", legenda: "Nebulosa de Órion", categoria: "ceu-profundo" },
        { caminho: "images/2026-10-29T21.46.38.png", legenda: "Detalhe de Céu Profundo", categoria: "ceu-profundo" },
        { caminho: "images/IMG_20260616_232609.jpg", legenda: "Rastos de Estrelas (Star Trails)", categoria: "ceu-profundo" },
        { caminho: "images/IMG_20260419_023636.jpg", legenda: "Rotação Estelar", categoria: "ceu-profundo" },
        
        // 🪐 Sistema Solar / Lua
        { caminho: "images/20250731_225930.jpg", legenda: "Captura Noturna", categoria: "sistema-solar" },
        { caminho: "images/Screenshot_20231019_163639_Facebook.jpg", legenda: "Júpiter", categoria: "sistema-solar" },
        { caminho: "images/Screenshot 2026-03-24 235314.png", legenda: "Processamento e Calibração", categoria: "sistema-solar" },
        { caminho: "images/Lua2.jpg", legenda: "Lua", categoria: "sistema-solar" },
        { caminho: "images/FB_IMG_1697729740640.jpg", legenda: "Trânsito de Vénus", categoria: "sistema-solar" },
        { caminho: "images/Lua7.jpg", legenda: "Lua Detalhe", categoria: "sistema-solar" },
        { caminho: "images/Lua.png", legenda: "Lua", categoria: "sistema-solar" },
        { caminho: "images/Lua.jpg", legenda: "Lua", categoria: "sistema-solar" },
        { caminho: "images/jupiter.jpg", legenda: "Júpiter", categoria: "sistema-solar" },
       
        
        // ☀️ Sol
        { caminho: "images/Sol5.png", legenda: "Sol - Processamento", categoria: "sol" },
        { caminho: "images/Sol6.png", legenda: "Disco Solar Detalhado", categoria: "sol" },
        { caminho: "images/sol.1.jpg", legenda: "Observação Solar 1", categoria: "sol" },
        { caminho: "images/sol.3.jpg", legenda: "Observação Solar 2", categoria: "sol" },
        { caminho: "images/sol.3.png", legenda: "Análise do Sol", categoria: "sol" },
        { caminho: "images/Screenshot_20231101_112836_Facebook.jpg", legenda: "Eclipse parcial do Sol", categoria: "sol" },
        { caminho: "images/EclipseSolar.jpg", legenda: "Eclipse Solar", categoria: "sol" },
    ];

    const containerPrincipal = document.getElementById("conteudo-principal");

    function criarSecao(titulo, itens) {
        if (itens.length === 0) return "";
        let htmlCards = '';
        itens.forEach(item => {
            htmlCards += `
                <div class="card">
                    <img src="${item.caminho}" alt="${item.legenda}" onclick="abrirModal('${item.caminho}', '${item.legenda}')">
                    <div class="card-title">${item.legenda}</div>
                </div>
            `;
        });
        return `
            <div class="section-title">${titulo}</div>
            <div class="gallery-container">${htmlCards}</div>
        `;
    }

    function renderizarGaleria(filtro) {
        containerPrincipal.innerHTML = "";
        const ceuProfundo = itensGaleria.filter(i => i.categoria === 'ceu-profundo');
        const sistemaSolar = itensGaleria.filter(i => i.categoria === 'sistema-solar');
        const sol = itensGaleria.filter(i => i.categoria === 'sol');

        if (filtro === 'todos') {
            containerPrincipal.innerHTML += criarSecao("🌌 Céu Profundo", ceuProfundo);
            containerPrincipal.innerHTML += criarSecao("🪐 Sistema Solar / Lua", sistemaSolar);
            containerPrincipal.innerHTML += criarSecao("☀️ Sol", sol);
        } else if (filtro === 'ceu-profundo') {
            containerPrincipal.innerHTML += criarSecao("🌌 Céu Profundo", ceuProfundo);
        } else if (filtro === 'sistema-solar') {
            containerPrincipal.innerHTML += criarSecao("🪐 Sistema Solar / Lua", sistemaSolar);
        } else if (filtro === 'sol') {
            containerPrincipal.innerHTML += criarSecao("☀️ Sol", sol);
        }
    }

    function filtrarGaleria(categoria, botao) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        botao.classList.add('active');
        renderizarGaleria(categoria);
    }

    function abrirModal(caminho, legenda) {
        const modal = document.getElementById("lightboxModal");
        const img = document.getElementById("imgAmpliada");
        const cap = document.getElementById("legendaAmpliada");

        modal.style.display = "flex";
        img.src = caminho;
        cap.innerText = legenda;
    }

    function fecharModal() {
        document.getElementById("lightboxModal").style.display = "none";
    }

    renderizarGaleria('todos');
</script>
</body>
</html>
