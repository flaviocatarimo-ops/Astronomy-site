<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Galeria de Astrofotografia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin-bottom: 5px;
        }
        p {
            color: #8a99ad;
            margin-bottom: 30px;
        }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #161b22;
            border: 1px: solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-title {
            padding: 15px;
            font-size: 14px;
            color: #c9d1d9;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h1>Minha Galeria de Astrofotografia</h1>
    <p>Trabalhos de captura e processamento com telescópio.</p>
    <p>Flávio da Silva</p>

    <div class="gallery-container" id="gallery"></div>

    <script>
        // Lista exata dos ficheiros de imagem que tens atualmente no repositório
      const imagens = [
   
    "images/2026-10-29T21.46.26.png",
    "images/2026-10-29T21.46.38.png",
    "images/FB_IMG_1697729740640.jpg",
    "images/Sol5.png",
    "images/Sol6.png",
    "images/sol.1.jpg",
    "images/sol.3.jpg",
    "images/sol.3.png",
    "images/Screenshot 2025-11-27 164725.png",
    "images/IMG_20260616_232609.jpg",
    "images/FB_IMG_1697729740640.jpg",
];

        const gallery = document.getElementById("gallery");

        imagens.forEach(nomeFicheiro => {
            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <img src="${nomeFicheiro}" alt="Astrofotografia">
                <div class="card-title">${nomeFicheiro}</div>
            `;

            gallery.appendChild(card);
        });
    </script>

</body>
</html>
