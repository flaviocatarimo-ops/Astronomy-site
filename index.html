<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Galeria de Astrofotografia</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Cabeçalho */
        h1 {
            margin-bottom: 10px;
            font-size: 32px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            color: #8a99ad;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .author {
            color: #58a6ff;
            margin-bottom: 30px;
            font-size: 15px;
            font-weight: bold;
        }

        /* Botões de Navegação / Filtro */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: #161b22;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: #30363d;
            border-color: #58a6ff;
            color: #ffffff;
        }

        /* Secções e Grelhas */
        .section-title {
            text-align: left;
            max-width: 1200px;
            margin: 40px auto 20px auto;
            font-size: 20px;
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
            padding-left: 5px;
        }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .card img, .card video {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .card-title {
            padding: 15px;
            font-size: 14px;
            color: #c9d1d9;
            word-break: break-all;
        }

        /* Rodapé */
        footer {
            margin-top: auto;
            padding-top: 50px;
            padding-bottom: 20px;
            color: #8a99ad;
            font-size: 13px;
            border-top: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .counters-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .contador {
            font-size: 12px;
            color: #58a6ff;
        }
    </style>
</head>
<body>

    <h1>Minha Galeria de Astrofotografia</h1>
    <div class="subtitle">Trabalhos de captura e processamento com telescópio.</div>
    <div class="author">Flávio da Silva</div>

    <!-- Botões de navegação por categorias -->
    <div class="filter-container">

        <button class="filter-btn" onclick="filtrarGaleria('sistema-solar', this)">Sistema Solar / Lua</button>
        <button class="filter-btn" onclick="filtrarGaleria('sol', this)">Sol</button>
    </div>

    <!-- Conteúdo onde todas as secções/fotografias são renderizadas -->
    <div id="conteudo-principal"></div>

    <footer>
        <div>&copy; 2026 Flávio da Silva. Todos os direitos reservados.</div>

            </div>
            <div class="contador">
                Visualizações da página: <span id="contador-visitas">A carregar...</span>
