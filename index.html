<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Galeria de Astrofotografia</title>
    <style>
        /* Configuração universal para compatibilidade em todos os navegadores e telemóveis */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 24px;
        }
        p {
            color: #8a99ad;
            margin-bottom: 20px;
        }
        /* Grelha responsiva adaptada a qualquer ecrã */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .card img, .card video {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .card-title {
            padding: 15px;
            font-size: 14px;
            color: #c9d1d9;
            word-break: break-all;
        }
        footer {
            margin-top: 40px;
            padding: 20px;
            color: #8a99ad;
            font-size: 13px;
            border-top: 1px solid #30363d;
        }
        .contador {
            margin-top: 8px;
            font-size: 12px;
            color: #58a6ff;
        }
    </style>
</head>
<body>

    <h1>Minha Galeria de Astrofotografia</h1>
    <p>Trabalhos de captura e processamento com telescópio.</p>
    <p>Flávio da Silva</p>

    <div class="gallery-container" id="gallery"></div>

    <footer>
        <div>&copy; 2026 Flávio da Silva. Todos os direitos reservados.</div>
        <div class="contador">
            Visualizações da página: <img src="https://api.countapi.xyz/hit/flaviocatarimo-ops/astronomy-site" alt="Contador de Visitas" style="vertical-align: middle;" onerror="this.style.display='none'">
        </div>
    </footer>

<script>
    // Lista de itens (imagens e vídeos) com legendas personalizadas seguras
    const itensGaleria = [
        // Céu profundo e rastos (fundo escuro)
        { tipo: "imagem", caminho: "images/2026-10-29T21.46.26.png", legenda: "Nebulosa de Órion" },
        { tipo: "imagem", caminho: "images/2026-10-29T21.46.38.png", legenda: "Detalhe de Céu Profundo" },
        { tipo: "imagem", caminho: "images/IMG_20260616_232609.jpg", legenda: "Rastos de Estrelas (Star Trails)" },
        { tipo: "imagem", caminho: "images/IMG_20260419_023636.jpg", legenda: "Rotação Estelar" },
        { tipo: "imagem", caminho: "images/20250731_225930.jpg", legenda: "Captura Noturna" },
        { tipo: "imagem", caminho: "images/Screenshot_20231019_163639_Facebook.jpg", legenda: "Jupiter" },
        { tipo: "imagem", caminho: "images/Screenshot 2026-03-24 235314.png", legenda: "Processamento e Calibração" },
        { tipo: "imagem", caminho: "images/Lua2.jpg", legenda: "Lua2" },
        { tipo: "imagem", caminho: "images/FB_IMG_1697729740640.jpg", legenda: "Transito de Venus" },
        
        // Imagens do Sol e discos brilhantes (no fim)
        { tipo: "imagem", caminho: "images/Sol5.png", legenda: "Sol - Processamento" },
        { tipo: "imagem", caminho: "images/Sol6.png", legenda: "Disco Solar Detalhado" },
        { tipo: "imagem", caminho: "images/sol.1.jpg", legenda: "Observação Solar 1" },
        { tipo: "imagem", caminho: "images/sol.3.jpg", legenda: "Observação Solar 3" },
        { tipo: "imagem", caminho: "images/sol.3.png", legenda: "Análise do Sol" }
    ];

    const gallery = document.getElementById("gallery");

    itensGaleria.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        let conteudoMedia = "";
        if (item.tipo === "video") {
            conteudoMedia = `<video src="${item.caminho}" controls autoplay loop muted playsinline></video>`;
        } else {
            conteudoMedia = `<img src="${item.caminho}" alt="Astrofotografia">`;
        }

        card.innerHTML = `
            ${conteudoMedia}
            <div class="card-title">${item.legenda}</div>
        `;

        gallery.appendChild(card);
    });
</script>
</body>
</html>
