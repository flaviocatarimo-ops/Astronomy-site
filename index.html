<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Galeria de Astrofotografia</title>
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Cabeçalho Destacado */
        header {
            margin-bottom: 35px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 42px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }
        .subtitle {
            color: #58a6ff;
            margin: 0 0 8px 0;
            font-size: 18px;
            font-weight: bold;
        }
        .author {
            color: #8a99ad;
            font-size: 14px;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: #161b22;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: #30363d;
            border-color: #58a6ff;
            color: #ffffff;
        }
        .section-title {
            text-align: left;
            max-width: 1200px;
            margin: 40px auto 20px auto;
            font-size: 20px;
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
            padding-left: 5px;
        }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card img:hover {
            transform: scale(1.03);
        }
        .card-title {
            padding: 15px;
            font-size: 14px;
            color: #c9d1d9;
            word-break: break-all;
        }

        /* Estilo do Modal (Lightbox) com melhoria de resolução/tamanho */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .modal-content {
            width: 100%;
            max-width: 1200px;
            max-height: 85vh;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.7);
            object-fit: contain;
        }
        .modal-caption {
            margin-top: 15px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #ffffff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-modal:hover {
            color: #58a6ff;
        }

        /* Caixa de Contacto */
        .contact-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto 30px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .contact-box h3 {
            margin-top: 0;
            color: #58a6ff;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .contact-box p {
            color: #c9d1d9;
            font-size: 14px;
            margin-bottom: 15px;
        }

            display: inline-block;
            background-color: #2126
