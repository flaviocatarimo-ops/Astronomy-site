<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Astrofotografia - Flávio Silva</title>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #ffffff; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
        }
        .gallery { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
            margin-top: 20px; 
        }
        .photo-card { 
            background: #161b22; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            width: 300px;
        }
        img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 6px; 
        }
        h1 { color: #58a6ff; }
    </style>
</head>
<body>
    <h1>Minha Galeria de Astrofotografia</h1>
    <p>Trabalhos de captura e processamento com telescópio.</p>
    
    <div class="gallery">
        <div class="photo-card">
            <img src="images/IMG_20260612_235411.jpg" alt="Astrofotografia">
            <p>Registo Astronómico</p>
        </div>
        <div class="photo-card">
            <img src="images/2026-10-29T21.46.26.png" alt="Astrofotografia">
            <p>Processamento Siril</p>
        </div>
        <div class="photo-card">
            <img src="images/2026-10-29T21.46.38.png" alt="Astrofotografia">
            <p>Detalhe Planetário</p>
        </div>
        <div class="photo-card">
            <img src="images/20260327_222156.jpg" alt="Astrofotografia">
            <p>Observação</p>
        </div>
        <div class="photo-card">
            <img src="images/PSX_20260325_192511.jpg" alt="Astrofotografia">
            <p>Captura Celestrial</p>
        </div>
    </div>
</body>
</html>
