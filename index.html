<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Astrofotografia - Flávio Silva</title>
    <style>
        body { 
            background-color: #0b0f19; 
            color: #ffffff; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
        }
        .gallery { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
            margin-top: 20px; 
        }
        .photo-card { 
            background: #161b22; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            width: 300px;
        }
        img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 6px; 
        }
        h1 { color: #58a6ff; }
        p { font-size: 14px; color: #8b949e; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Minha Galeria de Astrofotografia</h1>
    <p>Trabalhos de captura e processamento com telescópio.</p>
    
    <div class="gallery" id="gallery"></div>

    <script>
        // Lista com os nomes exatos dos ficheiros que estão na pasta 'images'
        const imagens = [
            "IMG_20260612_235411.jpg",
            "2026-10-29T21.46.26.png",
            "2026-10-29T21.46.38.png",
            "20260327_222156.jpg",
            "PSX_20260325_192511.jpg",
            "Screenshot_20260325_161541_Instagram.jpg"
        ];

        const galeriaDiv = document.getElementById("gallery");

        imagens.forEach(nomeFicheiro => {
            const card = document.createElement("div");
            card.className = "photo-card";
            card.innerHTML = `
                <img src="images/${nomeFicheiro}" alt="Astrofotografia">
                <p>${nomeFicheiro}</p>
            `;
            galeriaDiv.appendChild(card);
        });
    </script>
</body>
</html>
